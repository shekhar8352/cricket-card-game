# Host nginx site for pitch.sudhanshu-dev.in.
# Install: cp deploy/nginx-pitch.conf /etc/nginx/sites-available/pitch && ln -s ../sites-available/pitch /etc/nginx/sites-enabled/
# HTTPS is added by: certbot --nginx -d pitch.sudhanshu-dev.in
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name pitch.sudhanshu-dev.in;

  client_max_body_size 2m;

  # API (strip the /api prefix) and the live-match websocket.
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

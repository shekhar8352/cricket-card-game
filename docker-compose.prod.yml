# Production stack. Host nginx terminates TLS and proxies:
#   /      -> web (127.0.0.1:8080)
#   /api/  -> api (127.0.0.1:8000), including the live-match websocket
# Secrets come from .env next to this file (see deploy/.env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cricket
    # Server-local only; reach it from a laptop with `make tunnel`.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
      network: host
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://cricket:${POSTGRES_PASSWORD}@postgres:5432/cricket?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${PUBLIC_URL}
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./web
      network: host
      args:
        VITE_API_URL: ${PUBLIC_URL}/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  redisdata:
